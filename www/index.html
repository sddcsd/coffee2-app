<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>咖啡小记</title>
<style>
:root{
  --h:358;
  --bg:hsl(358,16%,90%);
  --card:hsl(358,22%,96%);
  --card2:hsl(358,16%,86%);
  --line:hsl(358,14%,80%);
  --text:hsl(358,18%,17%);
  --sub:hsl(358,10%,45%);
  --accent:#B34C4E;
  --focus:#E29A91;
  --deep:#673D47;
  --radius:16px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Roboto,"Microsoft YaHei",sans-serif;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{outline:none;appearance:none;-webkit-appearance:none}
#view{padding:6px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

.page-head{display:flex;align-items:center;gap:8px;padding:10px 2px 12px}
.title{flex:1;min-width:0;margin:0;font-size:21px;font-weight:700;letter-spacing:.4px;color:var(--deep);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:36px;height:36px;border:0;border-radius:12px;background:transparent;color:var(--sub);
  display:grid;place-items:center;cursor:pointer;padding:0;flex:0 0 auto}
.icon-btn:active{background:var(--card2)}
.icon-btn svg{width:20px;height:20px;display:block}
.icon-btn.sm svg{width:18px;height:18px}
.round-add{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);
  color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0;flex:0 0 auto}
.round-add svg{width:19px;height:19px}
.round-add:active{transform:scale(.93)}
.pill-toggle{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;
  padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.pill-toggle:active{background:var(--card2)}
.card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:14px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));
  width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;
  display:grid;place-items:center;cursor:pointer;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.fab svg{width:22px;height:22px}
.fab:active{transform:translateX(-50%) scale(.93)}

/* 豆仓状态标签 */
.status-tabs{display:flex;gap:4px;margin-bottom:10px;background:var(--card2);padding:4px;border-radius:12px}
.status-tabs button{flex:1;border:0;background:transparent;color:var(--sub);padding:8px 4px;border-radius:9px;
  font-size:12.5px;cursor:pointer;font-weight:500;transition:.16s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-tabs button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:700}

/* 搜索框 */
.search-bar{position:relative;margin-bottom:10px}
.search-bar input{width:100%;padding:10px 38px 10px 36px;border:1px solid var(--line);background:var(--card);
  border-radius:12px;font-size:14px;color:var(--text)}
.search-bar input:focus{border-color:var(--accent)}
.search-bar .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  color:var(--sub);pointer-events:none}
.search-bar .s-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;
  border:0;background:var(--card2);color:var(--sub);border-radius:50%;display:grid;place-items:center;
  cursor:pointer;padding:0}
.search-bar .s-clear svg{width:12px;height:12px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -1px 12px rgba(0,0,0,.06)}
.tab{flex:1;min-width:0;border:0;background:none;padding:7px 2px 6px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--sub);font-size:11px;cursor:pointer}
.tab.active{color:var(--accent)}
.tab-icon{width:23px;height:23px;display:block}
.tab-icon svg{width:100%;height:100%;display:block}
.tab-label{font-size:11px;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.swipe{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:10px;background:var(--card)}
.swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex}
.swipe-btn{border:0;width:70px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;padding:0}
.swipe-btn.edit{background:var(--accent)}
.swipe-btn.pin{background:var(--deep)}
.swipe-btn.del{background:#C0392B}
.swipe-content{position:relative;background:var(--card);padding:13px 14px;border-radius:var(--radius);
  box-shadow:var(--shadow);transition:transform .22s cubic-bezier(.22,.61,.36,1);will-change:transform}
.swipe-content.dragging{transition:none}

.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-name{font-size:16px;font-weight:700;color:var(--deep);flex:1;min-width:60px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;flex:0 0 auto}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.tag-status{background:var(--accent);color:#fff}
.tag-focus{background:var(--focus);color:var(--deep)}
.tag-friend{background:var(--card2);color:var(--accent)}
.card-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.grid2 .k{font-size:11.5px;color:var(--sub);line-height:1.3}
.grid2 .v{font-size:13.5px;color:var(--text);font-weight:500;margin-top:1px;word-break:break-all}
.full-row{grid-column:1/-1}
.divider{height:1px;background:var(--line);margin:12px 0}

/* 拼配表格 */
.blend-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;
  border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.blend-table th{background:var(--card2);color:var(--sub);font-weight:500;font-size:11.5px;
  padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.blend-table th:not(:last-child),
.blend-table td:not(:last-child){border-right:1px solid var(--line)}
.blend-table td{padding:6px 8px;color:var(--text);word-break:break-all;line-height:1.5}
.blend-table tr:not(:last-child) td{border-bottom:1px solid var(--line)}
.blend-table td.dash{color:var(--sub)}

.fld{display:block;margin-bottom:12px}
.fld-l{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;padding-left:2px}
.inp,textarea.inp,select.inp{width:100%;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.55}
.inp:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .fld{margin-bottom:12px}
.chk{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);cursor:pointer;margin-bottom:12px;user-select:none}
.chk .box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);display:grid;
  place-items:center;flex:0 0 auto;transition:.16s;color:transparent}
.chk.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
.chk .box svg{width:13px;height:13px}
.chk .lbl{font-size:14px;color:var(--sub);transition:.16s}
.chk.on .lbl{color:var(--accent);font-weight:600}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:#C0392B;color:#fff}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
.inline-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;
  border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--accent);
  font-size:13.5px;cursor:pointer;margin-bottom:10px}
.inline-add svg{width:16px;height:16px}

.stars{display:flex;gap:2px}
.star{border:0;background:none;padding:0 1px;font-size:19px;line-height:1;color:var(--line);cursor:pointer}
.star.on{color:var(--focus)}
.rating-row{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px 8px;margin-bottom:8px}
.rating-row .rl{font-size:13px;color:var(--sub);white-space:nowrap}
.rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.rating-grid .rating-row{margin-bottom:6px}
.rating-grid .full{grid-column:1/-1}

.fullpage{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .24s cubic-bezier(.22,.61,.36,1);overflow:hidden}
.fullpage.in{transform:translateX(0)}
.fp-head{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:var(--bg);border-bottom:1px solid var(--line);flex:0 0 auto}
.fp-title{flex:1;margin:0;font-size:17px;font-weight:700;color:var(--deep);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-body{flex:1;overflow-y:auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom));
  max-width:640px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200;display:flex;align-items:center;
  justify-content:center;padding:24px;opacity:0;transition:opacity .2s}
.mask.in{opacity:1}
.modal{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:340px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);transform:scale(.94);transition:transform .2s}
.mask.in .modal{transform:scale(1)}
.modal h3{margin:0 0 14px;font-size:16.5px;color:var(--deep)}
.modal .m-btns{display:flex;gap:10px;margin-top:6px}
.modal .m-btns .btn{flex:1;padding:11px}
.pick-list{display:flex;flex-direction:column;gap:10px}
.pick-item{display:flex;align-items:center;gap:13px;padding:15px;border-radius:14px;background:var(--card2);
  border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.pick-item:active{transform:scale(.98)}
.pick-item .pi-icon{width:38px;height:38px;flex:0 0 auto;color:var(--accent);display:grid;place-items:center}
.pick-item .pi-icon svg{width:100%;height:100%}
.pick-item .pi-t{font-size:15px;font-weight:600;color:var(--text)}
.pick-item .pi-s{font-size:12px;color:var(--sub);margin-top:2px}

.mp-year{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}
.mp-year button{border:0;background:var(--card2);width:34px;height:34px;border-radius:10px;
  color:var(--text);font-size:17px;cursor:pointer}
.mp-year .y{font-size:18px;font-weight:700;color:var(--deep);min-width:70px;text-align:center}
.mp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mp-grid button{border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:11px 0;
  font-size:13.5px;color:var(--text);cursor:pointer}
.mp-grid button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);z-index:300;
  background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;
  opacity:0;transition:.22s;pointer-events:none;max-width:80vw;text-align:center}
.toast.in{opacity:1;transform:translateX(-50%) translateY(0)}

.hist-pop{position:fixed;z-index:250;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;max-height:200px;
  overflow-y:auto;min-width:120px}
.hist-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;
  border-radius:9px;font-size:14px;color:var(--text);cursor:pointer}
.hist-pop button:active{background:var(--card2)}

.stat-big{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.stat-big .sb-row{display:flex;justify-content:space-between;gap:10px}
.stat-big .sb-item{flex:1;min-width:0}
.stat-big .sb-v{font-size:20px;font-weight:700;color:var(--deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-big .sb-k{font-size:11.5px;color:var(--sub);margin-top:2px}
.stat-title{font-size:13px;color:var(--sub);margin:16px 2px 8px;font-weight:600}

/* 统计三项左中右 */
.stat-triple{display:flex;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:12px}
.stat-triple .st-item{flex:1;padding:14px 4px;text-align:center;border-right:1px solid var(--line);min-width:0}
.stat-triple .st-item:last-child{border-right:0}
.stat-triple .st-v{font-size:17px;font-weight:700;color:var(--deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-triple .st-k{font-size:11px;color:var(--sub);margin-top:3px}

.bar-line{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px}
.bar-line .bl-name{width:78px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.bar-line .bl-track{flex:1;height:16px;background:var(--card2);border-radius:8px;overflow:hidden}
.bar-line .bl-fill{height:100%;background:var(--accent);border-radius:8px;min-width:2px}
.bar-line .bl-val{width:52px;text-align:right;flex:0 0 auto;color:var(--text);font-variant-numeric:tabular-nums}

/* 年度竖向柱状图 */
.vchart{background:var(--card);border-radius:var(--radius);padding:14px 12px 10px;box-shadow:var(--shadow)}
.vchart-head{font-size:12px;color:var(--sub);margin-bottom:10px;display:flex;justify-content:space-between}
.vchart-wrap{display:flex;gap:6px;height:160px}
.vchart-y{display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--sub);
  width:34px;text-align:right;padding-bottom:18px;flex:0 0 auto}
.vchart-plot{position:relative;flex:1;border-bottom:1px solid var(--line);border-left:1px solid var(--line);
  height:100%;min-width:0}
.vchart-grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line);opacity:.55}
.vchart-bars{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:flex-end;padding:0 2px;gap:1px}
.vchart-col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.vchart-pair{display:flex;gap:1px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.vbar{width:42%;max-width:7px;border-radius:2px 2px 0 0;min-height:1px;transition:height .3s}
.vbar.bean{background:var(--accent)}
.vbar.shop{background:var(--focus)}
.vchart-months{display:flex;padding:3px 2px 0 40px;font-size:10px;color:var(--sub)}
.vchart-months span{flex:1;text-align:center;min-width:0}
.chart-legend{display:flex;gap:16px;margin-top:10px;font-size:11.5px;color:var(--sub);justify-content:center}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabbar" class="tabbar"></nav>
</div>

<script>
/* ========== 工具 ========== */
const $  = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayStr = ()=> new Date().toLocaleDateString('sv-SE');
const num = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
function toast(msg){
  let t = $('.toast');
  if(!t){ t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(()=>t.classList.add('in'));
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('in'), 1900);
}

/* ========== 图标 ========== */
const STAR_PATH = 'M12 2.5l2.95 6.13 6.55.91-4.75 4.62 1.12 6.59L12 17.66l-5.87 3.09 1.12-6.59L2.5 9.54l6.55-.91z';
const ICON = {
  bean: (fill='var(--card)') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(30 15.6 11.2)">
      <ellipse cx="15.6" cy="11.2" rx="3.5" ry="5.5"/>
      <path d="M15.6 5.7c-1.55 1.8-1.55 9.2 0 11"/>
    </g>
    <g transform="rotate(-22 8.7 13.2)">
      <ellipse cx="8.7" cy="13.2" rx="4" ry="6.1" fill="${fill}"/>
      <path d="M8.7 7.1c-1.7 2-1.7 10.2 0 12.2"/>
    </g></svg>`,
  cup: () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.3 3.8c-.85 1.05-.85 1.85 0 2.9"/>
    <path d="M12 2.9c-.95 1.15-.95 2.05 0 3.2"/>
    <path d="M14.7 3.8c-.85 1.05-.85 1.85 0 2.9"/>
    <path d="M5.2 9.8h12.1v4.7a4.6 4.6 0 0 1-4.6 4.6h-2.9a4.6 4.6 0 0 1-4.6-4.6V9.8Z" fill="currentColor" stroke="none"/>
    <path d="M17.3 11.1h1.4a2.45 2.45 0 0 1 0 4.9h-1.4"/></svg>`,
  gear: () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
  plus: () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  back: () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  check: () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.4 4.4L19 7.5"/></svg>`,
  search: () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`,
  close: () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  starOutline: () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="${STAR_PATH}"/></svg>`,

    const d = JSON.parse(raw);
    return {
      settings: Object.assign({}, DEFAULT_STATE.settings, d.settings||{}),
      beans: d.beans||[], brews: d.brews||[], experiences: d.experiences||[],
      recipes: d.recipes||[],
      memory: Object.assign({dripper:[],grinder:[],grind:[],method:[]}, d.memory||{})
    };
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }

  try{

      settings:state.settings, beans:state.beans, brews:state.brews,
      experiences:state.experiences, recipes:state.recipes, memory:state.memory

/* ========== 计算 ========== */
const STATUS = { drinking:'在喝', stock:'囤豆中', done:'喝完' };
const STATUS_KEYS = ['drinking','stock','done'];

function priceInfo(bean){
  const ps = (bean.purchases||[]).filter(p=>num(p.price)>0 && num(p.weight)>0);
  if(!ps.length) return { latest:null, lowest:null };
  const sorted = [...ps].sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const latest = num(sorted[sorted.length-1].price) / num(sorted[sorted.length-1].weight);
  const lowest = Math.min(...ps.map(p=> num(p.price)/num(p.weight)));
  return { latest, lowest };
}
function fmtPrice(v){ return v==null ? '—' : v.toFixed(2)+' 元/g'; }

  [/印尼|印度尼西亚|苏门答腊|曼特宁|爪哇|苏拉威西|托拉贾|巴厘/i,'印度尼西亚'],
  [/洪都拉斯/i,'洪都拉斯'],

function toCountry(s){
  if(!s) return null;
  for(const [re,name] of ORIGIN_RULES) if(re.test(s)) return name;
  return null;
}

function renderBeanList(){
  let list = state.beans.filter(b=>b.status===ui.beanTab);
  const q = (ui.searchBean||'').trim().toLowerCase();
  if(q){
    list = list.filter(b=>{
      const hay = [
        b.name, b.roaster, b.origin, b.variety, b.process, b.flavors,
        ...(b.blendParts||[]).flatMap(x=>[x.origin,x.variety,x.process])
      ].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  list.sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
  return list.length ? list.map(beanCard).join('')
    : `<div class="empty">${q?'没有匹配的豆子':'这个分类还没有豆子'}</div>`;
}

/* 搜索/标签切换的 DOM 局部刷新（不重渲染整个页面，避免输入框失焦） */
window.__searchBean = function(val){
  ui.searchBean = val;
  const el = $('#beanList');
  if(el) el.innerHTML = renderBeanList();
  $$('#beanList .swipe').forEach(attachSwipe);
  const wrap = $('.search-bar');
  if(wrap){
    const existing = $('.s-clear', wrap);
    if(val && !existing){
      const btn = document.createElement('button');
      btn.className = 's-clear';
      btn.innerHTML = ICON.close();
      btn.onclick = ()=> window.__clearSearch('bean');
      wrap.appendChild(btn);
    }else if(!val && existing){
      existing.remove();
    }
  }
};
window.__clearSearch = function(which){
  if(which==='bean'){
    ui.searchBean = '';
    const inp = $('#beanSearch'); if(inp) inp.value = '';
    window.__searchBean('');
  }else if(which==='record'){
    ui.searchRecord = '';
    const inp = $('#recordSearch'); if(inp) inp.value = '';
    window.__searchRecord('');
  }else if(which==='recipe'){
    ui.searchRecipe = '';
    const inp = $('#recipeSearch'); if(inp) inp.value = '';
    window.__searchRecipe('');
  }
};

function viewRecord(){
  return `

  </div>

  <div class="search-bar">

    <input id="recordSearch" type="text" placeholder="搜索豆名 / 店名 / 笔记…"
      value="${esc(ui.searchRecord)}" oninput="window.__searchRecord(this.value)">
    ${ui.searchRecord?`<button class="s-clear" onclick="window.__clearSearch('record')">${ICON.close()}</button>`:''}
  </div>

  <div id="recordList">${renderRecordList()}</div>
  <button class="fab" data-act="new-record">${ICON.plus()}</button>`;
}

function renderRecordList(){
  const q = (ui.searchRecord||'').trim().toLowerCase();
  let items = [
    ...state.brews.map(b=>({t:'brew', d:b, ts:b.createdAt||0})),
    ...state.experiences.map(e=>({t:'exp', d:e, ts:e.createdAt||0}))
  ];
  if(q){
    items = items.filter(it=>{
      const d = it.d;
      const hay = [
        d.beanName, d.shop, d.drink, d.flavor, d.notes, d.technique, d.experience, d.other,
        d.dripper, d.grinder, d.method
      ].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  items.sort((a,b)=> (b.d.date||'').localeCompare(a.d.date||'') || (b.ts-a.ts));
  if(!items.length) return `<div class="empty">${q?'没有匹配的记录':'还没有记录，点 + 开始记录'}</div>`;
  return items.map(it=>{
    if(it.t==='brew'){
      const b = it.d;
      return `<div class="swipe" data-swipe-id="${b.id}" data-swipe-type="brew">
        <div class="swipe-actions">
          <button class="swipe-btn edit" data-act="edit-brew" data-id="${b.id}">修改</button>
          <button class="swipe-btn del" data-act="del-brew" data-id="${b.id}">删除</button>
        </div>
        <div class="swipe-content" data-act="open-brew" data-id="${b.id}">
          <div class="card-top">
            <div class="card-name">${esc(b.beanName||'手冲')}</div>
            <div class="card-tags"><span class="tag tag-focus">冲煮</span></div>
          </div>
          <div class="card-meta">
            <span>${esc(b.date||'')}</span>
            ${b.dripper?`<span>${esc(b.dripper)}</span>`:''}
            ${b.dose?`<span>${esc(String(b.dose))}g</span>`:''}
            ${b.ratio?`<span>1:${esc(String(b.ratio))}</span>`:''}
          </div>
        </div>
      </div>`;
    }else{
      const e = it.d;
      return `<div class="swipe" data-swipe-id="${e.id}" data-swipe-type="exp">
        <div class="swipe-actions">
          <button class="swipe-btn edit" data-act="edit-exp" data-id="${e.id}">修改</button>
          <button class="swipe-btn del" data-act="del-exp" data-id="${e.id}">删除</button>
        </div>
        <div class="swipe-content" data-act="open-exp" data-id="${e.id}">
          <div class="card-top">
            <div class="card-name">${esc(e.shop||e.drink||'门店体验')}</div>
            <div class="card-tags"><span class="tag tag-status">体验</span></div>
          </div>
          <div class="card-meta">
            <span>${esc(e.date||'')}</span>
            ${e.drink?`<span>${esc(e.drink)}</span>`:''}
            ${e.price?`<span>¥${esc(String(e.price))}</span>`:''}
          </div>
        </div>
      </div>`;
    }
  }).join('');
}
window.__searchRecord = function(val){
  ui.searchRecord = val;
  const el = $('#recordList');
  if(el) el.innerHTML = renderRecordList();
  $$('#recordList .swipe').forEach(attachSwipe);
  const wrap = $('.search-bar');
  if(wrap){
    const existing = $('.s-clear', wrap);
    if(val && !existing){
      const btn = document.createElement('button');
      btn.className = 's-clear';
      btn.innerHTML = ICON.close();
      btn.onclick = ()=> window.__clearSearch('record');
      wrap.appendChild(btn);
    }else if(!val && existing){
      existing.remove();
    }
  }
};

        if(i>=0) arr.splice(i,1);
        arr.unshift(v);
        if(arr.length>12) arr.length = 12;
      }
    });
    return o;
  };

function renderRecipeList(){
  let list = [...state.recipes];
  const q = (ui.searchRecipe||'').trim().toLowerCase();
  if(q){
    list = list.filter(r=>{
      const hay = [r.title, r.dripper, r.grinder, r.grind, r.method, r.flavor, r.technique, r.notes]
        .filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  list.sort((a,b)=>{
    if((b.pinned?1:0)-(a.pinned?1:0)) return (b.pinned?1:0)-(a.pinned?1:0);
    return (b.createdAt||0)-(a.createdAt||0);
  });
  return list.length ? list.map(recipeCard).join('')
    : `<div class="empty">${q?'没有匹配的方案':'还没有方案，点右上角 + 新建'}</div>`;
}
window.__searchRecipe = function(val){
  ui.searchRecipe = val;
  const el = $('#recipeList');
  if(el) el.innerHTML = renderRecipeList();
  $$('#recipeList .swipe').forEach(attachSwipe);
  const wrap = $('.search-bar');
  if(wrap){
    const existing = $('.s-clear', wrap);
    if(val && !existing){
      const btn = document.createElement('button');
      btn.className = 's-clear';
      btn.innerHTML = ICON.close();
      btn.onclick = ()=> window.__clearSearch('recipe');
      wrap.appendChild(btn);
    }else if(!val && existing){
      existing.remove();
    }
  }
};

/* ========== 统计 ========== */
let statsYM = todayStr().slice(0,7);
function viewStats(){
  const [y, m] = statsYM.split('-').map(Number);
  const monthStr = statsYM;
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthPurchases = state.beans.flatMap(b => (b.purchases||[]).map(p=>({...p, bean:b})))
    .filter(p => (p.date||'').startsWith(monthStr));
  const beanSpend = monthPurchases.reduce((s,p)=>s+num(p.price),0);
  const shopList = state.experiences.filter(e=>(e.date||'').startsWith(monthStr));
  const shopSpend = shopList.reduce((s,e)=>s+num(e.price),0);
  const totalWeight = monthPurchases.reduce((s,p)=>s+num(p.weight),0);
  const avgPerDay = (beanSpend+shopSpend) / daysInMonth;
  const avgPrice = totalWeight>0 ? beanSpend/totalWeight : 0;
  const buyCount = {};
  state.beans.forEach(b=>{
    const n = (b.purchases||[]).length;
    if(n>0) buyCount[b.name||'未命名'] = (buyCount[b.name||'未命名']||0) + n;
  });
  const topBeans = Object.entries(buyCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const planCount = {};
  state.brews.forEach(b=>{
    const key = [b.dripper, b.method].filter(Boolean).join(' · ');
    if(key) planCount[key] = (planCount[key]||0)+1;
  });
  const topPlans = Object.entries(planCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const countryCount = {};
  state.beans.forEach(b=>{
    const src = b.isBlend ? (b.blendParts||[]).map(x=>x.origin).filter(Boolean) : [b.origin];
    src.forEach(o=>{
      const c = toCountry(o);
      if(c) countryCount[c] = (countryCount[c]||0)+1;
    });
  });
  const topCountries = Object.entries(countryCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const procCount = {};
  state.beans.forEach(b=>{
    const src = b.isBlend ? (b.blendParts||[]).map(x=>x.process).filter(Boolean) : [b.process];
    src.forEach(p=>{ if(p) procCount[p] = (procCount[p]||0)+1; });
  });
  const topProcs = Object.entries(procCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const yearBean = Array(12).fill(0), yearShop = Array(12).fill(0);
  state.beans.forEach(b => (b.purchases||[]).forEach(p=>{
    if((p.date||'').startsWith(String(y))){
      const mo = Number(p.date.slice(5,7))-1;
      if(mo>=0&&mo<12) yearBean[mo] += num(p.price);
    }
  }));
  state.experiences.forEach(e=>{
    if((e.date||'').startsWith(String(y))){
      const mo = Number(e.date.slice(5,7))-1;
      if(mo>=0&&mo<12) yearShop[mo] += num(e.price);
    }
  });
  const maxVal = Math.max(1, ...yearBean, ...yearShop);

  return `
  <div class="page-head">
    <h1 class="title">统计</h1>
    <button class="pill-toggle" data-act="pick-month">${y}年${m}月 ▾</button>
  </div>

  <div class="stat-big">
    <div class="sb-row">
      <div class="sb-item"><div class="sb-v">¥${(beanSpend+shopSpend).toFixed(1)}</div><div class="sb-k">本月总花费</div></div>
      <div class="sb-item"><div class="sb-v">¥${avgPerDay.toFixed(1)}</div><div class="sb-k">平均每天</div></div>
      <div class="sb-item"><div class="sb-v">¥${avgPrice.toFixed(2)}</div><div class="sb-k">平均克价</div></div>
    </div>
  </div>

  <div class="stat-triple">
    <div class="st-item">
      <div class="st-v">¥${beanSpend.toFixed(1)}</div>
      <div class="st-k">买豆消费</div>
    </div>
    <div class="st-item">
      <div class="st-v">¥${shopSpend.toFixed(1)}</div>
      <div class="st-k">门店消费</div>
    </div>
    <div class="st-item">
      <div class="st-v">${totalWeight.toFixed(0)}g</div>
      <div class="st-k">购入重量</div>
    </div>
  </div>

  <div class="stat-title">年度消费统计（${y}年）</div>
  <div class="vchart">
    <div class="vchart-head"><span>单位：元</span><span>最高 ¥${maxVal.toFixed(0)}</span></div>
    <div class="vchart-wrap">
      <div class="vchart-y">
        <span>${maxVal.toFixed(0)}</span>
        <span>${(maxVal/2).toFixed(0)}</span>
        <span>0</span>
      </div>
      <div class="vchart-plot">
        <div class="vchart-grid" style="top:0"></div>
        <div class="vchart-grid" style="top:50%"></div>
        <div class="vchart-bars">
          ${Array.from({length:12},(_,i)=>{
            const bh = maxVal>0 ? yearBean[i]/maxVal*100 : 0;
            const sh = maxVal>0 ? yearShop[i]/maxVal*100 : 0;
            return `<div class="vchart-col" title="${i+1}月 买豆¥${yearBean[i].toFixed(1)} 门店¥${yearShop[i].toFixed(1)}">
              <div class="vchart-pair">
                <div class="vbar bean" style="height:${bh}%"></div>
                <div class="vbar shop" style="height:${sh}%"></div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
    <div class="vchart-months">
      ${Array.from({length:12},(_,i)=>`<span>${i+1}</span>`).join('')}
    </div>
    <div class="chart-legend">
      <span><i style="background:var(--accent)"></i>买豆</span>
      <span><i style="background:var(--focus)"></i>门店</span>
    </div>
  </div>

  ${ topPlans.length ? `<div class="stat-title">常用方案</div>
  <div class="card">${topPlans.map(([k,v])=>barLine(k,v,Math.max(...topPlans.map(x=>x[1])))).join('')}</div>`:'' }
  ${ topBeans.length ? `<div class="stat-title">常买豆子</div>
  <div class="card">${topBeans.map(([k,v])=>barLine(k,v+' 次',Math.max(...topBeans.map(x=>x[1])))).join('')}</div>`:'' }
  ${ topCountries.length ? `<div class="stat-title">产地分布（国家）</div>
  <div class="card">${topCountries.map(([k,v])=>barLine(k,v,Math.max(...topCountries.map(x=>x[1])))).join('')}</div>`:'' }
  ${ topProcs.length ? `<div class="stat-title">处理法</div>
  <div class="card">${topProcs.map(([k,v])=>barLine(k,v,Math.max(...topProcs.map(x=>x[1])))).join('')}</div>`:'' }
  <div style="height:20px"></div>
  `;
}
function barLine(name, val, max){
  const w = max>0 ? Math.max(3, val/max*100) : 0;
  return `<div class="bar-line">
    <div class="bl-name">${esc(name)}</div>
    <div class="bl-track"><div class="bl-fill" style="width:${w}%"></div></div>
    <div class="bl-val">${esc(String(val))}</div>
  </div>`;
}
function openMonthPicker(cur, cb){
  const [cy, cm] = cur.split('-').map(Number);
  let y = cy;
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `<div class="modal" style="max-width:320px">
    <div class="mp-year">
      <button data-y="-1">‹</button>
      <span class="y" id="mpY">${y}</span>
      <button data-y="1">›</button>
    </div>
    <div class="mp-grid" id="mpGrid"></div>
    <div class="m-btns" style="margin-top:16px">
      <button class="btn ghost" data-close>取消</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  requestAnimationFrame(()=>mask.classList.add('in'));
  function drawGrid(){
    $('#mpY', mask).textContent = y;
    $('#mpGrid', mask).innerHTML = Array.from({length:12},(_,i)=>{
      const on = (y===cy && i+1===cm);
      return `<button data-m="${i+1}" class="${on?'on':''}">${i+1}月</button>`;
    }).join('');
  }
  drawGrid();
  mask.onclick = e=>{
    const yb = e.target.closest('[data-y]');
    if(yb){ y += Number(yb.dataset.y); drawGrid(); return; }
    const mb = e.target.closest('[data-m]');
    if(mb){ close(); cb(`${y}-${String(mb.dataset.m).padStart(2,'0')}`); return; }
    if(e.target===mask || e.target.closest('[data-close]')) close();
  };
  function close(){ mask.classList.remove('in'); setTimeout(()=>mask.remove(),200); }
}

function migrateOldData(d) {
  const mapTheme = t => {
    if (!t) return 'pink';
    const m = { 'euro-blue':'blue', 'euro-pink':'pink', 'euro-green':'green',
                'euro-gold':'gold', 'euro-purple':'purple', 'dark':'dark' };
    return m[t] || 'pink';
  };
  const mapStatus = s => ({ '在喝':'drinking', '囤豆中':'stock', '喝完':'done' }[s] || 'drinking');

  const newState = {
    settings: {
      appName: d.settings?.appName || '咖啡小记',
      theme: mapTheme(d.settings?.theme)
    },
    beans: [], brews: [], experiences: [], recipes: [],
    memory: { dripper:[], grinder:[], grind:[], method:[] }
  };

  if (Array.isArray(d.beans)) {
